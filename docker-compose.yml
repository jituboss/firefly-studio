# ---------------------------------------------------------------------------
# Firefly Studio — local development stack (E1-04)
#
#   docker compose up -d postgres redis   # deps only, run the app with pnpm dev
#   docker compose --profile app up       # the whole stack, app included
#   docker compose --profile firefly up   # + a real Firefly III to develop against
# ---------------------------------------------------------------------------

name: firefly-studio

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: firefly_studio
      POSTGRES_PASSWORD: firefly_studio
      POSTGRES_DB: firefly_studio
      # Deterministic collation so index ordering matches across machines.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U firefly_studio -d firefly_studio']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ['app']
    # Explicit image name so a pre-built tag can be reused with --no-build.
    image: firefly-studio:${FIREFLY_STUDIO_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://firefly_studio:firefly_studio@postgres:5432/firefly_studio
      REDIS_URL: redis://redis:6379
      # Dev-only placeholder keys. Generate real ones for any real deployment:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-ZGV2LW9ubHktZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9uIQ==}
      AUTH_SECRET: ${AUTH_SECRET:-ZGV2LW9ubHktYXV0aC1zZWNyZXQtcmVwbGFjZS1tZS1wbHo=}
      # Self-hosted Firefly usually lives on a LAN, so this is on for local dev.
      FIREFLY_ALLOW_PRIVATE_NETWORKS: 'true'
      FIREFLY_ALLOW_INSECURE_HTTP: 'true'
      LOG_LEVEL: info
      RUN_MIGRATIONS_ON_BOOT: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # A real Firefly III instance to develop against (E24-06 seeds it).
  # Opt in with: docker compose --profile firefly up -d
  # -------------------------------------------------------------------------
  firefly-db:
    profiles: ['firefly']
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: firefly
      POSTGRES_PASSWORD: firefly
      POSTGRES_DB: firefly
    volumes:
      - firefly-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U firefly -d firefly']
      interval: 5s
      timeout: 5s
      retries: 10

  firefly:
    profiles: ['firefly']
    image: fireflyiii/core:version-6.5.5
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      APP_ENV: local
      APP_KEY: SomeRandomStringOf32CharsExactly
      SITE_OWNER: dev@localhost
      DB_CONNECTION: pgsql
      DB_HOST: firefly-db
      DB_PORT: 5432
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: firefly
      TRUSTED_PROXIES: '**'
    volumes:
      - firefly-upload:/var/www/html/storage/upload
    depends_on:
      firefly-db:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  firefly-db-data:
  firefly-upload:
