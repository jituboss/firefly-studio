<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Firefly Studio</title>
    <!--
      E22-07 — the offline fallback, served by the service worker when a
      navigation cannot reach the network.

      Deliberately a static file with inline styles and no script. It has to
      render when the network is gone, which rules out anything the app
      normally relies on: no Next.js chunk, no stylesheet request, no font.
      Inline <style> is safe here because this file is served by the service
      worker from the cache, not through the CSP-bearing middleware.

      It shows no figures. Every number in this app belongs to somebody's
      finances, and a page that survives being offline would also survive
      signing out.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f1f3f6;
        --fg: #12141a;
        --muted: #5b6472;
        --card: #ffffff;
        --border: #dfe3ea;
        --brand: #1e61c5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12141a;
          --fg: #e8eaee;
          --muted: #9aa3b2;
          --card: #181b22;
          --border: #262b36;
          --brand: #5b8def;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 26rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 28px 24px;
        text-align: center;
      }
      svg {
        width: 48px;
        height: 48px;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 0.9375rem;
        line-height: 1.5;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--brand);
        border: 0;
        border-radius: 8px;
        padding: 10px 18px;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <rect width="512" height="512" rx="115" fill="#1e61c5" />
        <g transform="translate(96 96) scale(13.333)">
          <path
            d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"
            fill="none"
            stroke="#ffffff"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </g>
      </svg>
      <h1>You are offline</h1>
      <p>
        Firefly Studio needs a connection to reach your ledger. Your data is on your Firefly III
        instance, not on this device, so there is nothing to show until the network is back.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
