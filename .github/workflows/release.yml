name: Release

# One pipeline. It gates every push and pull request; only a tag publishes.
#
#   pull_request        verify + build both arches, push nothing
#   push to main        the same — a gate, not a release
#   push a `v*` tag     ... and push the version tags, open the GitHub release
#
# Pushing a branch and its tag together (`git push origin main v0.4.0`) starts
# two runs for the one commit. Only the tag's run may publish; the branch's is
# a gate. Anything else has them racing to write the same Docker Hub tags.
#
# `pnpm release <version>` creates the tag; pushing it is what publishes.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a run that is mid-publish; superseding a branch build is fine.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  IMAGE: jituboss/firefly-studio
  NEXT_TELEMETRY_DISABLED: '1'
  # Deterministic throwaway values so build and tests can boot. Never real keys.
  APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  AUTH_SECRET: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=
  DATABASE_URL: postgresql://firefly_studio:firefly_studio@localhost:5432/firefly_studio

jobs:
  # Seconds, and everything downstream waits on it. A tag that disagrees with
  # package.json used to fail *after* the verify gate and the image build; here
  # it fails before either has started.
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      channel: ${{ steps.v.outputs.channel }}
      release: ${{ steps.v.outputs.release }}
      publish: ${{ steps.v.outputs.publish }}
      build_date: ${{ steps.v.outputs.build_date }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        run: |
          PKG=$(node -p "require('./package.json').version")

          {
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # Only a version tag publishes. A branch push builds both
            # architectures to prove the image still compiles and stops there:
            # an untagged commit has no version, so any tag it wrote would have
            # to be a moving one, and a moving tag written by every merge is a
            # release nobody decided to make.
            if [[ "$GITHUB_REF" == refs/tags/v* && "${{ github.event_name }}" == "push" ]]; then
              echo "publish=true"
            else
              echo "publish=false"
            fi
          } >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            # Not a release. The version is still stamped into the image so a
            # container built from a branch can say what it is, even though this
            # build is never pushed anywhere.
            {
              echo "release=false"
              echo "version=${PKG}+${GITHUB_SHA::7}"
              echo "prerelease=false"
              echo "channel=none"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json ($PKG)."
            exit 1
          fi

          # Anything with a hyphen is a prerelease under semver: 0.1.0-alpha.1.
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
            # The channel is the word, not the word and its number. `${V#*-}`
            # alone yields "alpha.1", which published a second tag identical to
            # the version instead of the moving `alpha` tag RELEASING.md
            # promises. Trim the iteration too.
            CHANNEL="${VERSION#*-}"
            CHANNEL="${CHANNEL%%.*}"
          else
            PRERELEASE=false
            CHANNEL=stable
          fi

          {
            echo "release=true"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "channel=$CHANNEL"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: meta

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: firefly_studio
          POSTGRES_PASSWORD: firefly_studio
          POSTGRES_DB: firefly_studio
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U firefly_studio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # E23-06 — the dependency gate. `moderate`, not `high`: anything we
      # consciously accept is written down in pnpm-workspace.yaml's
      # auditConfig with the reasoning, rather than hidden behind a threshold
      # that quietly swallows a whole severity band.
      - name: Dependency audit
        run: pnpm audit --audit-level moderate

      # E23-08 — the same scan the pre-commit hook runs, as a hard gate. The
      # hook is skippable (it has to be, or it gets uninstalled); this is not.
      # Pinned rather than `latest` so a new release of the scanner cannot turn
      # an unrelated pull request red.
      - name: Secret scan
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1 detect \
            --source . --config .gitleaks.toml --redact --no-banner

      - name: Unit tests
        run: pnpm test:cov

      # Proves the committed migrations actually apply to a clean database,
      # which `drizzle-kit generate` alone does not (E25-02).
      - name: Apply migrations to a clean database
        run: pnpm db:migrate

      - name: Build
        run: pnpm build

      # E22-05 — fail on a step change in route weight. The budget file is
      # committed, so an intended rise shows up as a diff in review rather than
      # as a number nobody sees.
      - name: Bundle budget
        run: pnpm check:bundle

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # Each architecture builds on a runner of its own architecture, in parallel
  # with `verify`. Emulating arm64 through QEMU on an amd64 runner — which is
  # what a single `platforms: linux/amd64,linux/arm64` build does — took over
  # half an hour on its own, because a Next.js build under binfmt runs an order
  # of magnitude slower. Native arm64 runners are free for public repositories.
  #
  # Nothing here is pullable: the layers go up addressed by digest with no tag
  # on them, and `publish` is what attaches names, after `verify` is green.
  build:
    name: Image (${{ matrix.arch }})
    needs: meta
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: needs.meta.outputs.publish == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            APP_VERSION=${{ needs.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ needs.meta.outputs.build_date }}
          # A branch or pull request only has to prove the image still builds.
          outputs: >-
            ${{ needs.meta.outputs.publish == 'true'
              && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE)
              || 'type=cacheonly' }}
          # Separate scopes: one shared cache would have the two architectures
          # evicting each other's layers on every run.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export the digest
        if: needs.meta.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          # The manifest step reassembles `<image>@sha256:<hex>`, so the file
          # is named for the bare hex.
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: needs.meta.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The gate and the two images finished in parallel; this is the first step
  # that makes anything public, and it needs every one of them.
  publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [meta, verify, build]
    if: needs.meta.outputs.publish == 'true'
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `latest` must never point at a prerelease: someone running
      # `docker pull jituboss/firefly-studio` expects the stable line. An alpha
      # gets its exact version plus a moving channel tag (`alpha`) instead.
      # This job only runs for a tag, so every tag computed here is a real one.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.meta.outputs.release == 'true' && needs.meta.outputs.prerelease == 'false' }}
            type=semver,pattern={{major}},enable=${{ needs.meta.outputs.release == 'true' && needs.meta.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.meta.outputs.release == 'true' && needs.meta.outputs.prerelease == 'false' }}
            type=raw,value=${{ needs.meta.outputs.channel }},enable=${{ needs.meta.outputs.release == 'true' && needs.meta.outputs.prerelease == 'true' }}

      # One multi-arch manifest over the two digests, published under every
      # tag at once. No layer is re-uploaded — they are already in the registry.
      - name: Create the manifest
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        run: |
          docker buildx imagetools inspect \
            "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [meta, publish]
    if: needs.meta.outputs.release == 'true'
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes need the previous tag

      - name: Extract this version's changelog section
        run: |
          node scripts/changelog-section.mjs "${{ needs.meta.outputs.version }}" > RELEASE_NOTES.md
          {
            echo ""
            echo "## Container image"
            echo ""
            echo '```'
            echo "docker pull ${IMAGE}:${{ needs.meta.outputs.version }}"
            echo '```'
          } >> RELEASE_NOTES.md

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true

  # E1-16 — @sentry/cli is blocked for ordinary installs (it downloads a ~20MB
  # binary). Approve it only here, where source maps are uploaded. Runs beside
  # `publish` rather than inside it, so a second Next.js build never sits on the
  # critical path, and is skipped silently when the token is not configured: a
  # missing Sentry setup must not stop a release that is otherwise good.
  sourcemaps:
    name: Sentry source maps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [meta, verify]
    if: needs.meta.outputs.release == 'true'
    env:
      # `if:` cannot read the `secrets` context — GitHub rejects the workflow
      # file outright with "Unrecognized named-value: 'secrets'". Hoisting the
      # value into the job env makes it readable as `env.…` in a condition.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.SENTRY_AUTH_TOKEN != ''
      - uses: pnpm/action-setup@v4
        if: env.SENTRY_AUTH_TOKEN != ''
      - uses: actions/setup-node@v7
        if: env.SENTRY_AUTH_TOKEN != ''
        with:
          node-version: 24
          cache: pnpm
      - name: Upload source maps to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ needs.meta.outputs.version }}
        run: |
          pnpm install --frozen-lockfile --prefer-offline --allow-build=@sentry/cli
          pnpm build

  # Informational: a new upstream release should not block a merge, but it
  # should be visible. `spec:update --check` exits 2 on removed operations.
  spec-drift:
    name: Firefly III spec drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Check for a newer Firefly III specification
        run: pnpm spec:update --check

      # The committed spec/generated output must match what the script produces.
      - name: Verify generated output is current
        run: |
          pnpm spec:codegen
          if ! git diff --quiet -- spec/generated; then
            echo "::error::spec/generated is stale. Run 'pnpm spec:codegen' and commit the result."
            git diff --stat -- spec/generated
            exit 1
          fi

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Audit
        run: pnpm audit --audit-level high

  # A workflow file that does not parse fails the run with zero jobs and an
  # error only visible in the run's annotations — which is how an `if:` reading
  # the `secrets` context reached main and burned two release runs. actionlint
  # catches that statically, so it never gets that far again.
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color
