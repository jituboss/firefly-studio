# E23-06 — dependency updates, opened as pull requests so they go through the
# same gate as anything else: format, lint, typecheck, tests, migrations, build.
#
# Weekly rather than daily. This is a single-maintainer project, and a queue of
# pull requests nobody has time to read is not security, it is noise that
# teaches you to ignore the thing that matters.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # One pull request for the routine churn, so the interesting ones stand
    # out. Security updates are never grouped — see below.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: ['minor', 'patch']
      production-minor:
        dependency-type: production
        update-types: ['minor', 'patch']
    ignore:
      # Next.js majors change the App Router's contracts; those are a deliberate
      # piece of work, not a dependency bump to merge on a Monday.
      - dependency-name: next
        update-types: ['version-update:semver-major']
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      # Pinned to Next's major, not its own. eslint-config-next 16 was merged
      # against Next 15 and broke `pnpm lint` outright — ESLint died with a
      # circular-structure error before it read a single file. This one moves
      # when Next does.
      - dependency-name: eslint-config-next
        update-types: ['version-update:semver-major']
      # Pinned to the runtime in docker/Dockerfile. Types for a newer Node than
      # the one we ship describe APIs that are not there, which typechecks
      # something that then fails at run time.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    labels: ['dependencies']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ['dependencies', 'ci']

  # The base image in docker/Dockerfile. Its OS packages are the half of the
  # dependency surface that `pnpm audit` cannot see.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ['dependencies', 'docker']
    ignore:
      # Node majors are chosen, not bumped. Dependabot moved this to
      # node:25-alpine, which does not build: 25 is the Current line and no
      # longer ships corepack, so the image failed on its second layer. Only
      # even-numbered LTS releases belong here, and moving between them is a
      # deliberate step with the image built and booted to prove it.
      - dependency-name: node
        update-types: ['version-update:semver-major']
